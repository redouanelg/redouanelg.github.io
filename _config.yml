# Dependencies
markdown:         CommonMarkGhPages

commonmark:
  # UNSAFE lets raw HTML through (e.g. the <p class="message"> contact boxes)
  options: ["UNSAFE", "SMART"]
  extensions: ["strikethrough", "autolink", "table"]

# Permalinks
permalink:        pretty

# Setup
title:            Redouane Lguensat
description:      'Machine learning for ocean, atmosphere, and climate science'
url:              'https://redouanelg.github.io'
baseurl:          ''
keywords:         'redouane lguensat machine learning ocean sea surface temperature height data assimilation'

author:
  name:           'Redouane Lguensat'

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
