# Research themes, used by the homepage. Themes with a `layer` are the
# background layers in satellite mode (the first one shows on load); `name`
# and `stat` fill the skill chips and Souls-mode attributes, `relic` is the
# Souls-mode name.

- id: downscaling
  name: "Statistical downscaling"
  layer: "Downscaling"
  feed: "CMIP6 · 100 km → 1 km"
  relic: "Lens of Fine Detail"
  stat: 20

- id: bias
  name: "Bias correction"
  layer: "Bias correction"
  feed: "model vs observations"
  relic: "Quantile Shield"
  stat: 20

- id: tuning
  name: "Climate model tuning"
  layer: "Model tuning"
  feed: "perturbed-parameter ensemble"
  relic: "Talisman of History Matching"
  stat: 20

- id: eddies
  name: "Ocean eddy detection"
  layer: "Eddies"
  feed: "SSH · altimetry L4"
  relic: "EddyNet"
  stat: 18

- id: assimilation
  name: "Data assimilation"
  relic: "Tome of Analogs"
  stat: 17

- id: hybrid
  name: "Hybrid modeling"
  relic: "Ring of Invariance"
  stat: 16
