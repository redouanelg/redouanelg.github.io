<div class="sidebar">
  <img src="{{ '/images/profilepic.png' | relative_url }}" alt="Portrait of Redouane Lguensat" class="sidebar-portrait">

  <div class="sidebar-about">
    <h3>
      <a href="{{ '/aboutMe/' | relative_url }}">{{ site.title }}</a>
    </h3>
  </div>

  <nav class="sidebar-nav" aria-label="Main navigation">
    {% for link in site.data.navigation.main %}
    <a class="sidebar-nav-item{% if page.url == link.url %} active{% endif %}" href="{{ link.url | relative_url }}">{{ link.title }}</a>
    {% endfor %}
  </nav>

  <div class="container sidebar-sticky">
    <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
  </div>
</div>
